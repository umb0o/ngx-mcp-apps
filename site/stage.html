<section class="stage" data-host aria-label="Live example">
  <div class="chat">
    <div class="stage-bar">
      <span class="stage-title">Chat</span>
      <button type="button" data-replay>Run again</button>
    </div>
    <p class="bubble user" data-ask>What should I pack for Lisbon?</p>
    <p class="toolcall">The model calls the tool <code data-tool>show_packing_list</code></p>
    <div class="frame" data-frame>
      <!-- host.js sets the address once it listens: the app speaks first, as soon as it loads -->
      <iframe data-src="APP_URL" title="The example application"></iframe>
      <noscript
        ><p>
          <a href="APP_URL">Open the example application</a> (the live demo needs JavaScript).
        </p></noscript
      >
    </div>
    <div class="actions-row" data-actions></div>
    <p class="context" data-context hidden aria-live="polite">
      <span class="label">Added to the model context</span> <span data-context-text></span>
    </p>
    <div
      class="conversation"
      data-chat-extra
      aria-live="polite"
      tabindex="0"
      role="region"
      aria-label="Conversation"
    ></div>
    <div class="rounds" data-rounds></div>
  </div>
  <details class="wire">
    <summary>Messages between the app and the host</summary>
    <p class="ends" aria-hidden="true"><span>app</span><span>host</span></p>
    <ol data-log tabindex="0" aria-label="Messages between the app and the host"></ol>
  </details>
</section>
