# Runs on every push to dev and on every pull request: formatting, tests and build. It never publishes.
# main is protected: changes arrive only through pull requests, and only from the dev branch.
name: CI

on:
  push:
    branches: [dev]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Pull requests into main are accepted only from dev
  source-branch:
    if: github.event_name == 'pull_request' && github.base_ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Only dev can be merged into main
        run: |
          if [ "$HEAD_REF" != "dev" ] || [ "$HEAD_REPO" != "$GITHUB_REPOSITORY" ]; then
            echo "Pull requests into main must come from the dev branch of this repository (got $HEAD_REPO:$HEAD_REF)." >&2
            exit 1
          fi
        env:
          HEAD_REF: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      # The documentation site: it also compiles the example and the copy-and-paste components
      - run: npm run build:site

  # For each supported Angular major: a new application, `ng add`, Angular Material, one HTML file, a browser.
  # Also every Monday: a new release of Angular or Material can break us without any change here.
  compat:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        angular: [18, 19, 20, 21, 22]
    name: Angular ${{ matrix.angular }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build
      - run: npm run test:compat -- ${{ matrix.angular }}
