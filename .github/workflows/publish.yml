# Releases happen only through pull requests: when a pull request from dev is merged into main and the version in
# projects/ngx-mcp-apps/package.json is not on npm yet, this workflow builds the library and STAGES it on npm.
# A staged version is not public: it becomes public only when the owner approves it on npmjs.com.
#
# It uses npm Trusted Publishing (OIDC): there is no npm token, here or in the repository secrets.
# npm trusts this exact workflow file in this exact repository, as configured once on npmjs.com:
#   package Settings -> Trusted publishing -> GitHub Actions
#   Organization or user: umb0o   Repository: ngx-mcp-apps   Workflow filename: publish.yml
#   ("npm publish" left unchecked: only staged publishing is allowed)
#
# To release: on dev, set the version in projects/ngx-mcp-apps/package.json and add the CHANGELOG entry;
# open a pull request into main and merge it; then approve the staged version on npmjs.com.
name: Release to npm

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # No registry-url here: it would write a placeholder npm token that hides the OIDC login
          package-manager-cache: false # never use caching in release builds

      # Staged publishing needs a recent npm
      - run: npm install -g npm@latest

      - name: Is this version already on npm?
        id: version
        run: |
          VERSION=$(node -p "require('./projects/ngx-mcp-apps/package.json').version")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if npm view "ngx-mcp-apps@$VERSION" version >/dev/null 2>&1; then
            echo "Version $VERSION is already on npm: nothing to release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "Version $VERSION is new: it will be staged."
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.version.outputs.release == 'true'
        run: npm ci
      - if: steps.version.outputs.release == 'true'
        run: npm run format:check
      - if: steps.version.outputs.release == 'true'
        run: npm test
      - if: steps.version.outputs.release == 'true'
        run: npm run build

      # Staged, not public: approve it on npmjs.com to make it public. OIDC: no token needed.
      - if: steps.version.outputs.release == 'true'
        run: npm stage publish --access public --registry https://registry.npmjs.org/ --loglevel http
        working-directory: dist/ngx-mcp-apps
