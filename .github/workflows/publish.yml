# Releases happen only through pull requests: when a pull request from dev is merged into main, every package of
# this repository whose version is not on npm yet is built and STAGED on npm.
# A staged version is not public: it becomes public only when the owner approves it on npmjs.com.
#
# Packages: ngx-mcp-apps (projects/ngx-mcp-apps) and ngx-mcp-apps-builder (projects/ngx-mcp-apps-builder).
#
# It uses npm Trusted Publishing (OIDC): there is no npm token, here or in the repository secrets.
# npm trusts this exact workflow file in this exact repository, as configured once per package on npmjs.com:
#   package Settings -> Trusted publishing -> GitHub Actions
#   Organization or user: umb0o   Repository: ngx-mcp-apps   Workflow filename: publish.yml
#   ("npm publish" left unchecked: only staged publishing is allowed)
# A package that is not on npm at all cannot be configured there: its first version is published by hand, once.
#
# To release: on dev, set the version in the package.json of the package and add the CHANGELOG entry;
# the release pull request into main is opened automatically; merge it; then approve the staged version on npmjs.com.
name: Release to npm

on:
  push:
    branches: [main]

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          # No registry-url here: it would write a placeholder npm token that hides the OIDC login
          package-manager-cache: false # never use caching in release builds

      # Staged publishing needs a recent npm
      - run: npm install -g npm@latest

      - name: Which packages have a new version?
        id: plan
        run: |
          RELEASE=""
          for PACKAGE in ngx-mcp-apps ngx-mcp-apps-builder; do
            VERSION=$(node -p "require('./projects/$PACKAGE/package.json').version")
            if ! npm view "$PACKAGE" name >/dev/null 2>&1; then
              echo "::notice::$PACKAGE is not on npm yet: publish its first version by hand, then configure trusted publishing."
            elif npm view "$PACKAGE@$VERSION" version >/dev/null 2>&1; then
              echo "$PACKAGE $VERSION is already on npm."
            else
              echo "$PACKAGE $VERSION is new: it will be staged."
              RELEASE="$RELEASE $PACKAGE"
            fi
          done
          echo "packages=$RELEASE" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.packages != ''
        run: npm ci
      - if: steps.plan.outputs.packages != ''
        run: npm run format:check
      - if: steps.plan.outputs.packages != ''
        run: npm test
      - if: steps.plan.outputs.packages != ''
        run: npm run build

      # Staged, not public: approve on npmjs.com to make it public. OIDC: no token needed.
      - name: Stage the new versions
        if: steps.plan.outputs.packages != ''
        run: |
          for PACKAGE in ${{ steps.plan.outputs.packages }}; do
            (cd "dist/$PACKAGE" && npm stage publish --access public --registry https://registry.npmjs.org/ --loglevel http)
          done
