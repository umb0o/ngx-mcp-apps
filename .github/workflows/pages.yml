# Publishes the documentation site to GitHub Pages when main changes (that is, when a pull request from dev is merged).
# Needs, once: Settings -> Pages -> Build and deployment -> Source: "GitHub Actions".
name: Documentation site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          # The whole history: the sitemap dates each page by the last commit of its sources
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: npm ci
      # The site is cut out of the README files and uses the library and the builder built here
      - run: npm run build
      - run: npm run build:site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/site
      - id: deployment
        uses: actions/deploy-pages@v4
